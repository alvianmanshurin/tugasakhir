# Project Configuration - OPTIMIZED FOR LOW-END LAPTOP
# PENGEMBANGAN SUB SISTEM PERHITUNGAN JUMLAH KENDARAAN BERMOTOR BERBASIS PENGOLAHAN CITRA
# Studi Kasus: UPT K3L ITERA

# Hardware Info:
# - CPU: Intel Core i3-1115G4 (2 cores, 4 threads, 3.0GHz)
# - RAM: 8GB
# - GPU: Intel UHD Graphics (Integrated, NO CUDA)
# - OS: Windows 11 Home

project:
  name: "Vehicle Counting System - UPT K3L ITERA"
  author: "Penelitian Tugas Akhir"
  version: "1.0.0"

# Model Configuration - Using YOLOv11n (Nano) for CPU
model:
  # yolo11n = Nano (2.6M params) - TERBAIK untuk CPU/laptop rendah
  # yolo11s = Small (9.2M params) - alternatif jika ingin lebih akurat
  # yolo11m = Medium (20.1M params) - TIDAK direkomendasikan untuk laptop ini
  architecture: "yolo11n.pt"      # Bobot COCO, hanya untuk starting point training
  # Path bobot hasil training (dihasilkan oleh src/train.py).
  # Dipakai oleh evaluate/detect/gui/db - JANGAN diubah manual.
  best_weights: "runs/detect/models/vehicle_detection/weights/best.pt"
  # Folder tempat training menyimpan output
  project_dir: "runs/detect/models/vehicle_detection"
  input_size: 416  # Dikurangi dari 640 untuk kecepatan di CPU
  confidence_threshold: 0.5   # Ambang "high" - track baru hanya dari deteksi ini
  # Ambang "low" untuk rescue track yang hilang sebentar (terjebak, occlusion).
  # PENTING: model.predict() harus dijalankan pada ambang TERENDAH ini,
  # kalau tidak(low < high) cabang low-confidence tidak pernah terisi.
  low_conf_threshold: 0.25
  iou_threshold: 0.45
  device: "cpu"  # Explicit CPU karena tidak ada CUDA
  half: false     # CPU tidak mendukung fp16

# Training Configuration - Optimized for CPU
training:
  epochs: 50  # Dikurangi dari 100 untuk hemat waktu
  batch_size: 4  # Dikurangi dari 16 untuk hemat RAM (8GB)
  learning_rate: 0.01
  image_size: 416  # Dikurangi dari 640 untuk kecepatan
  patience: 15  # Early stopping
  save_period: 10
  workers: 2  # Dikurangi dari 4 untuk hemat RAM
  optimizer: "SGD"  # SGD lebih hemat memori dari Adam
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  close_mosaic: 10
  # Tambahan untuk CPU optimization
  amp: false  # Disable mixed precision (CPU tidak support)
  cache: false  # Disable caching untuk hemat RAM
  verbose: true

# Augmentasi Configuration - OPTIMIZED FOR VEHICLE COUNTING
# Fokus: Meningkatkan deteksi bus/truk + menjaga akurasi counting
#
# Only arguments VALID for ultralytics detection training are used.
# `blur` and `grayscale` are NOT supported by ultralytics for the detection
# task (classification only) - forcing them makes training crash with
# "is not a valid YOLO argument". Low-light / camera-shake robustness is
# handled by hsv_v (brightness), which is detection-native.
# `erasing` is also a no-op for detection, so there is nothing to disable.
augmentation:
  # === FLIP ===
  fliplr: 0.5           # Flip horizontal 50% (aman untuk kendaraan)
  flipud: 0.0           # Flip vertikal MATI (kendaraan tidak terbalik)

  # === MOSAIC ===
  mosaic: 1.0           # Mosaic augmentasi (gabung 4 gambar)
  # close_mosaic sudah di training section (= 10)

  # === COLOR / HSV ===
  hsv_h: 0.015          # Hue shift (0-1)
  hsv_s: 0.7            # Saturation (0-1)
  hsv_v: 0.4            # Brightness (0-1) - robustness minim cahaya CCTV

  # === GEOMETRI ===
  degrees: 0.0          # Rotasi MATI (kamera fixed di gerbang)
  translate: 0.1        # Translasi 10%
  scale: 0.5            # Scale 50-150% (variasi ukuran motor->truk)
  shear: 5.0            # Shear ±5° (simulasi sudut pandang kamera)
  perspective: 0.001    # Perspektif ringan (distorsi kamera)

  # === MATIKAN (berbahaya untuk counting) ===
  mixup: 0.0            # MixUp MATI (ganggu bounding box)
  copy_paste: 0.0       # Copy-Paste MATI (bisa duplikasi kendaraan)

# Dataset Configuration
dataset:
  # Path relatif terhadap root project (src/utils/paths.py me-resolve ke absolut)
  yaml_path: "data/dataset.yaml"
  train_images: "data/annotated/images/train"
  val_images: "data/annotated/images/val"
  test_images: "data/annotated/images/test"
  train_labels: "data/annotated/labels/train"
  val_labels: "data/annotated/labels/val"
  test_labels: "data/annotated/labels/test"

  # Nama kelas - sumber kebenaran tunggal untuk mapping class id.
  # Harus identik dengan data/dataset.yaml dan config/predefined_classes.txt
  names:
    0: motor
    1: mobil
    2: bus
    3: truk

  # Split grouping: frame video berurutan di-group per blok N frame sebelum
  # diacak, supaya frame yang berdekatan tidak masuk train DAN val sekaligus
  # (leakage temporal). Dengan ekstrak interval 15 (0,5 detik per frame),
  # 1 grup = 30 frame ≈ 15 detik video - tetangga dekat selalu satu split.
  group_size: 30

  # Asal video tiap frame di pool "merged".
  #
  # Pool merged_ = 4 video digabung berurutan sesuai urutan 'video_files'
  # di bawah, nomor urut berurutan tanpa tumpang tindih (saat ini 2817 frame,
  # ekstrak interval 15). Rentang di bawah DITULIS OTOMATIS oleh tahap merge:
  #   python main.py extract --action merge
  #   python main.py workflow --extract        (extract + merge bersamaan)
  # Jadi jangan mengubahnya manual - ekstrak ulang dengan interval berbeda
  # akan memperbaruinya.
  #
  # Kenapa ini penting: blok group_size frame memotong batas antar video,
  # sehingga frame dari dua kamera berbeda bisa berakhir di grup yang sama
  # lalu masuk split yang sama. Dengan video_ranges, grup dihitung per video
  # sehingga batas antar kamera tidak pernah dilanggar.
  #
  # Format: nama video: [nomor_awal, nomor_akhir] (inklusif, berbasis nomor
  # merged_). Kosongkan daftar (video_ranges: {}) untuk kembali ke perilaku
  # blok tanpa batas video.
  video_ranges:
    KIRI-7: [0, 694]
    KIRI-9: [695, 1417]
    TENGAH-7: [1418, 2133]
    TENGAH-9: [2134, 2816]

  # Video source for frame extraction
  video_source: "D:/KULIAH/Tugas Akhir/Data video Tugas Akhir"
  video_files:
    - "KIRI-7.MOV"
    - "KIRI-9.MOV"
    - "TENGAH-7.MOV"
    - "TENGAH-9.MOV"

# Detection Configuration
detection:
  source: "data/raw"
  output_dir: "outputs/detections"
  save_frames: true
  save_video: true
  show_preview: false
  line_thickness: 2
  show_conf: true
  show_labels: true
  classes: [0, 1, 2, 3]

# ROI Configuration (Region of Interest)
roi:
  enabled: true
  # Koordinat boundary ditulis pada resolusi REFERENSI di bawah, lalu
  # otomatis di-rescale ke resolusi frame yang sedang diproses.
  # Penting: frame video ITERA adalah 1920x1080.
  reference_resolution:
    width: 1920
    height: 1080
  # Format: [x, y] dalam koordinat reference_resolution
  boundary:
    top_left: [60, 497]      # Kiri atas
    top_right: [390, 484]    # Kanan atas
    bottom_left: [111, 1007] # Kiri bawah
    bottom_right: [979, 822] # Kanan bawah
  min_bbox_height: 20        # Ukuran bbox minimum (px pada resolusi frame)
  draw_roi: true             # Gambar area ROI di frame

# Object Tracking Configuration (ByteTrack-inspired)
tracking:
  enabled: true
  max_age: 30               # Hapus track setelah 30 frame tanpa match
  min_hits: 3               # Track dianggap valid setelah 3 match
  max_distance: 80.0        # Jarak maksimum matching (px)
  track_buffer: 50          # Simpan 50 center history per track
  show_track_id: true       # Tampilkan ID di bounding box
  show_velocity: false      # Tampilkan vektor kecepatan

# Counting Configuration (Dual-Line)
counting:
  line1_position: 0.48           # Garis 1 (atas) - dalam ROI area
  line2_position: 0.75           # Garis 2 (bawah) - dalam ROI area
  direction: "both"              # "up", "down", atau "both"
  min_track_length: 3            # Frame minimum sebelum dihitung
  # Toleransi perpindahan (px pada resolusi reference) sebelum lintasan
  # dianggap diam. Tanpa ini, satu frame jitter bisa salah menentukan arah.
  min_displacement: 25
  draw_lines: true            # Gambar garis 1 & 2 pada frame output

# Evaluation Configuration
evaluation:
  output_dir: "outputs/evaluation"
  metrics:
    - "precision"
    - "recall"
    - "f1_score"
    - "map50"
    - "map50_95"
    - "fps"
  confusion_matrix: true
  pr_curve: true
  f1_curve: true

# Visualization
visualization:
  color_map:
    motor: [255, 0, 0]
    mobil: [0, 255, 0]
    bus: [0, 0, 255]
    truk: [255, 255, 0]
  font_scale: 0.6
  font_thickness: 2
  show_fps: true
  show_count: true
